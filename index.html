<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모여집중 | ADHD 대시보드</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#233047;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#25364c;color:white;padding:22px max(20px,calc((100vw - 1150px)/2))}h1{margin:0;font-size:24px}header p{margin:5px 0;color:#d5dce7}main{max-width:1150px;margin:auto;padding:20px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#e2e8f0;color:#243247}button.primary,button.active{background:#376f72;color:white}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e2a750}input,textarea,select{padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:white;max-width:100%}textarea{width:100%;min-height:100px}section[hidden]{display:none}.panel{background:white;border:1px solid #dfe4ec;border-radius:16px;padding:17px;margin:12px 0}.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quad{min-height:210px;background:white;border:1px solid #dfe4ec;border-top:5px solid var(--accent);border-radius:14px;padding:14px}.quad h3{margin:0}.quad small{color:#66758a}.task{background:#f3f6fa;border-radius:9px;padding:10px;margin-top:9px;display:flex;gap:8px;justify-content:space-between;align-items:center;cursor:grab}.task span{overflow-wrap:anywhere}.task button{padding:5px 9px}.formrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.formrow input{flex:1;min-width:180px}.entry{border-bottom:1px solid #e2e8f0;padding:12px 0}.entry:last-child{border:0}.muted{color:#6b7280;font-size:13px}.day{border:1px solid #e0e5ec;border-radius:9px;padding:8px;min-height:95px;background:white;overflow-wrap:anywhere}.day.today{border:2px solid #376f72}.day strong{display:block}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.event{display:block;background:#dcece9;border-radius:5px;padding:3px;margin-top:4px;font-size:12px}.year{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.year button{min-height:65px}.streak{color:#a45d13;font-weight:bold}dialog{border:0;border-radius:15px;box-shadow:0 20px 70px #0005;max-width:460px;width:90%}dialog form{display:grid;gap:12px}dialog label{display:grid;gap:5px}#timer{font-size:36px;font-variant-numeric:tabular-nums}footer{padding:15px 0;color:#697586;font-size:12px}@media(max-width:650px){.matrix{grid-template-columns:1fr}.calendar{gap:2px}.day{padding:3px;min-height:75px;font-size:11px}.event{font-size:10px}.year{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><header><h1>🌿 모여집중</h1><p>생각을 비우고, 오늘 할 일 하나부터.</p></header><main>
<nav aria-label="메뉴"><button class="active" data-tab="matrix">우선순위</button><button data-tab="dump">브레인 덤프</button><button data-tab="habits">습관·루틴</button><button data-tab="calendar">달력</button><button data-tab="focus">집중 타이머</button><button data-tab="diary">일기</button></nav>
<section id="matrix"><div class="panel"><div class="formrow"><input id="newTask" placeholder="할 일 추가" aria-label="할 일"><select id="newQuadrant" aria-label="분면"><option value="0">긴급·중요</option><option value="1">중요·비긴급</option><option value="2">긴급·비중요</option><option value="3">비긴급·비중요</option></select><button class="primary" id="addTask">추가</button></div></div><div class="matrix" id="quadrants"></div></section>
<section id="dump" hidden><div class="panel"><h2>브레인 덤프</h2><p class="muted">생각을 적으면서 바로 분류하세요. 세부 항목은 선택사항이에요.</p><textarea id="dumpText" placeholder="떠오르는 생각을 자유롭게 적으세요"></textarea><div class="formrow"><label>분류 <select id="dumpType"><option value="dump">메모</option><option value="task">할 일</option><option value="habit">습관·루틴</option><option value="event">일정</option></select></label><label id="dumpQuadrantWrap" hidden>분면 <select id="dumpQuadrant"><option value="0">긴급·중요</option><option value="1">중요·비긴급</option><option value="2">긴급·비중요</option><option value="3">비긴급·비중요</option></select></label><label id="dumpDateWrap" hidden>날짜 <input id="dumpDate" type="date"></label><label id="dumpTimeWrap" hidden>시간 <input id="dumpTime" type="time"></label><label id="dumpRepeatWrap" hidden>반복 <select id="dumpRepeat"><option value="daily">매일</option><option value="weekly">매주</option></select></label><label id="dumpDayWrap" hidden>요일 <select id="dumpDay"><option value="1">월</option><option value="2">화</option><option value="3">수</option><option value="4">목</option><option value="5">금</option><option value="6">토</option><option value="0">일</option></select></label></div><div id="dumpTaskDetails"><div class="formrow"><label>예상 소요시간 (분) <input id="dumpMinutes" type="number" min="0" step="1" placeholder="분"></label><label>준비물 (선택) <input id="dumpSupplies" placeholder="예: 노트북"></label></div><label>하위 할 일 (선택) <input id="dumpSub" placeholder="하위 할 일 입력 후 Enter"></label><label>하위 소요시간 (분) <input id="dumpSubMinutes" type="number" min="0" step="1" placeholder="분"></label><div id="dumpSubList"></div></div><button class="primary" id="addDump">저장</button></div><div class="panel" id="dumpList"></div></section>
<section id="habits" hidden><div class="panel"><h2>습관·루틴</h2><div class="formrow"><input id="habitName" placeholder="습관 이름"><input type="time" id="habitTime" value="07:00"><select id="habitRepeat"><option value="daily">매일</option><option value="weekly">매주</option></select><select id="habitDay" aria-label="요일"><option value="1">월</option><option value="2">화</option><option value="3">수</option><option value="4">목</option><option value="5">금</option><option value="6">토</option><option value="0">일</option></select><button class="primary" id="addHabit">추가</button></div></div><div class="panel" id="habitList"></div></section>
<section id="calendar" hidden><div class="panel"><div class="formrow"><button id="prevDate">←</button><strong id="dateLabel"></strong><button id="nextDate">→</button><select id="viewMode"><option value="month">월</option><option value="day">일</option><option value="week">주</option><option value="year">년</option></select></div><div class="formrow" style="margin-top:12px"><input id="eventName" placeholder="일정 이름"><input id="eventDate" type="date"><input id="eventTime" type="time"><button class="primary" id="addEvent">일정 추가</button></div></div><div class="panel" id="calendarContent"></div></section>
<section id="diary" hidden><div class="panel"><div class="formrow"><button id="diaryPrev">←</button><strong id="diaryMonth"></strong><button id="diaryNext">→</button></div><p class="muted">날짜의 +를 눌러 일기를 작성하세요.</p><div class="calendar" id="diaryGrid"></div></div><div class="panel" id="diaryEntries"></div></section><section id="focus" hidden><div class="panel"><h2>지금 할 일 하나</h2><input id="focusTask" placeholder="예: 파일 열기" style="width:100%"><div id="timer">25:00</div><button class="primary" id="startTimer">시작</button><button id="pauseTimer">일시정지</button><button id="resetTimer">초기화</button><p id="timerMessage" role="status"></p></div></section>
<footer>현재 데이터는 이 브라우저에만 저장됩니다. 공용 PC에서는 사용하지 마세요. 회사 기밀이나 개인정보는 입력하지 마세요. 실시간 공동 접속 및 서버 동기화는 아직 지원하지 않습니다.</footer>
</main><dialog id="editDialog"><form method="dialog" id="editForm"><h2>항목 분류·수정</h2><label>내용<input id="editTitle" required></label><label>분류<select id="editType"><option value="dump">브레인 덤프</option><option value="task">할 일</option><option value="habit">습관·루틴</option><option value="event">일정</option></select></label><div id="taskFields"><label>우선순위<select id="editQuadrant"><option value="0">긴급·중요</option><option value="1">중요·비긴급</option><option value="2">긴급·비중요</option><option value="3">비긴급·비중요</option></select></label></div><div id="habitFields"><label>시간<input id="editTime" type="time" value="07:00"></label><label>반복<select id="editRepeat"><option value="daily">매일</option><option value="weekly">매주</option></select></label><label>요일<select id="editDay"><option value="1">월</option><option value="2">화</option><option value="3">수</option><option value="4">목</option><option value="5">금</option><option value="6">토</option><option value="0">일</option></select></label></div><div id="extraTaskFields"><label>예상 소요시간 (분)<input id="editMinutes" type="number" min="0" step="1"></label><label>준비물 (선택)<input id="editSupplies"></label><label>하위 할 일 (Enter로 추가)<input id="editSub" placeholder="하위 할 일"></label><label>하위 소요시간 (분)<input id="editSubMinutes" type="number" min="0" step="1"></label><div id="editSubList"></div></div><div id="eventFields"><label>날짜<input id="editDate" type="date"></label><label>시간<input id="editEventTime" type="time"></label></div><div class="formrow"><button class="primary" value="save">저장</button><button value="cancel">취소</button></div></form></dialog>
<script>
'use strict';const $=id=>document.getElementById(id),today=()=>{const d=new Date();return localDate(d)},localDate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
let data;try{data=JSON.parse(localStorage.getItem('moyo-dashboard-v1'))||{items:[]}}catch{data={items:[]}}if(!Array.isArray(data.items))data={items:[]};function save(){localStorage.setItem('moyo-dashboard-v1',JSON.stringify(data));render()}function add(type,title,extra={}){title=title.trim();if(!title)return;data.items.push({id:uid(),type,title,...extra});save()}function remove(id){if(confirm('삭제할까요?')){data.items=data.items.filter(x=>x.id!==id);save()}}function item(id){return data.items.find(x=>x.id===id)}function makeButton(text,fn){const b=document.createElement('button');b.textContent=text;b.addEventListener('click',fn);return b}function render(){renderMatrix();renderDump();renderHabits();renderCalendar();if(typeof renderDiary==="function")renderDiary()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('main>section').forEach(x=>x.hidden=x.id!==b.dataset.tab)});
$('addTask').onclick=()=>{add('task',$('newTask').value,{quadrant:Number($('newQuadrant').value)});$('newTask').value=''};$('newTask').onkeydown=e=>{if(e.key==='Enter')$('addTask').click()};
const names=['긴급하고 중요함','중요하지만 긴급하지 않음','긴급하지만 중요하지 않음','긴급하지도 중요하지도 않음'],subs=['Do First','Schedule','Delegate','Eliminate'],colors=['#db7d72','#6a9a8d','#e2b35e','#98a1b1'];
function renderMatrix(){const root=$('quadrants');root.replaceChildren();names.forEach((name,q)=>{const div=document.createElement('div');div.className='quad';div.style.setProperty('--accent',colors[q]);div.innerHTML='<h3>'+name+'</h3><small>'+subs[q]+' · 이곳에 카드를 드래그하세요</small>';div.ondragover=e=>e.preventDefault();div.ondrop=e=>{e.preventDefault();const x=item(e.dataTransfer.getData('text/plain'));if(x&&x.type==='task'){x.quadrant=q;save()}};data.items.filter(x=>x.type==='task'&&Number(x.quadrant||0)===q).forEach(x=>{const card=document.createElement('div');card.className='task';card.draggable=true;card.ondragstart=e=>e.dataTransfer.setData('text/plain',x.id);const span=document.createElement('span');span.textContent=x.title;card.append(span,makeButton('수정',()=>openEdit(x.id)),makeButton('×',()=>remove(x.id)));div.append(card)});root.append(div)})}
$('addDump').onclick=()=>{add('dump',$('dumpText').value);$('dumpText').value=''};
function renderDump(){const root=$('dumpList');root.replaceChildren();const items=data.items.filter(x=>x.type==='dump');if(!items.length)root.textContent='아직 메모가 없어요.';items.forEach(x=>{const div=document.createElement('div');div.className='entry';const p=document.createElement('p');p.textContent=x.title;div.append(p,makeButton('분류하기',()=>openEdit(x.id)),makeButton('삭제',()=>remove(x.id)));root.append(div)})}
$('addHabit').onclick=()=>{add('habit',$('habitName').value,{time:$('habitTime').value,repeat:$('habitRepeat').value,day:Number($('habitDay').value),checks:[]});$('habitName').value=''};
function due(x,date){const d=new Date(date+'T12:00:00');return x.repeat!=='weekly'||d.getDay()===Number(x.day||0)}function streak(x){let count=0,d=new Date(today()+'T12:00:00');for(let i=0;i<366;i++){const key=localDate(d);if(due(x,key)){if((x.checks||[]).includes(key))count++;else if(key!==today())break;else if(i>0)break}d.setDate(d.getDate()-1)}return count}
function renderHabits(){const root=$('habitList');root.replaceChildren();const list=data.items.filter(x=>x.type==='habit').sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));if(!list.length)root.textContent='습관을 추가해 보세요.';list.forEach(x=>{const div=document.createElement('div');div.className='entry formrow';const check=document.createElement('input');check.type='checkbox';check.checked=(x.checks||[]).includes(today());check.disabled=!due(x,today());check.setAttribute('aria-label',x.title+' 완료');check.onchange=()=>{x.checks=x.checks||[];x.checks=check.checked?[...new Set([...x.checks,today()])]:x.checks.filter(v=>v!==today());save()};const span=document.createElement('span');span.textContent=(x.time||'시간 미정')+' · '+x.title+' · '+(x.repeat==='weekly'?'매주 '+['일','월','화','수','목','금','토'][x.day||0]:'매일');const badge=document.createElement('span');badge.className='streak';badge.textContent='🔥 '+streak(x)+'일';div.append(check,span,badge,makeButton('수정',()=>openEdit(x.id)),makeButton('삭제',()=>remove(x.id)));root.append(div)})}
let editId=null;function fields(){const t=$('editType').value;$('taskFields').hidden=t!=='task';$('habitFields').hidden=t!=='habit';$('eventFields').hidden=t!=='event'}$('editType').onchange=fields;function openEdit(id){const x=item(id);if(!x)return;editId=id;$('editTitle').value=x.title;$('editType').value=x.type;$('editQuadrant').value=String(x.quadrant||0);$('editTime').value=x.time||'07:00';$('editRepeat').value=x.repeat||'daily';$('editDay').value=String(x.day??1);$('editDate').value=x.date||today();$('editEventTime').value=x.time||'09:00';fields();$('editDialog').showModal()}$('editForm').addEventListener('submit',e=>{if(e.submitter?.value!=='save')return;const x=item(editId),title=$('editTitle').value.trim(),type=$('editType').value;if(!x||!title){e.preventDefault();return}x.title=title;x.type=type;if(type==='task')x.quadrant=Number($('editQuadrant').value);if(type==='habit'){x.time=$('editTime').value;x.repeat=$('editRepeat').value;x.day=Number($('editDay').value);x.checks=x.checks||[]}if(type==='event'){x.date=$('editDate').value;x.time=$('editEventTime').value}save()});
$('addEvent').onclick=()=>{if(!$('eventDate').value){alert('날짜를 선택해 주세요.');return}add('event',$('eventName').value,{date:$('eventDate').value,time:$('eventTime').value});$('eventName').value=''};
let cursor=new Date();$('eventDate').value=today();function events(date){return data.items.filter(x=>x.type==='event'&&x.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}function dayCell(d){const cell=document.createElement('div');cell.className='day'+(localDate(d)===today()?' today':'');const s=document.createElement('strong');s.textContent=(d.getMonth()+1)+'/'+d.getDate();cell.append(s);events(localDate(d)).forEach(x=>{const b=document.createElement('button');b.className='event';b.textContent=(x.time?x.time+' ':'')+x.title;b.onclick=()=>openEdit(x.id);cell.append(b)});return cell}function renderCalendar(){const root=$('calendarContent');root.replaceChildren();const mode=$('viewMode').value,y=cursor.getFullYear(),m=cursor.getMonth();$('dateLabel').textContent=mode==='year'?y+'년':mode==='month'?y+'년 '+(m+1)+'월':localDate(cursor);if(mode==='year'){const g=document.createElement('div');g.className='year';for(let i=0;i<12;i++){const b=makeButton((i+1)+'월 · '+data.items.filter(x=>x.type==='event'&&x.date?.startsWith(y+'-'+String(i+1).padStart(2,'0'))).length+'개',()=>{cursor=new Date(y,i,1);$('viewMode').value='month';renderCalendar()});g.append(b)}root.append(g);return}const grid=document.createElement('div');grid.className='calendar';let start,end;if(mode==='month'){start=new Date(y,m,1);start.setDate(start.getDate()-start.getDay());end=new Date(y,m+1,0);end.setDate(end.getDate()+6-end.getDay())}else if(mode==='week'){start=new Date(y,m,cursor.getDate()-cursor.getDay());end=new Date(start);end.setDate(end.getDate()+6)}else{start=new Date(y,m,cursor.getDate());end=new Date(start)}if(mode!=='day')for(const t of ['일','월','화','수','목','금','토']){const h=document.createElement('strong');h.textContent=t;grid.append(h)}for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))grid.append(dayCell(new Date(d)));root.append(grid)}$('viewMode').onchange=renderCalendar;function move(n){const mode=$('viewMode').value;if(mode==='year')cursor.setFullYear(cursor.getFullYear()+n);else if(mode==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);else cursor.setDate(cursor.getDate()+n*(mode==='week'?7:1));renderCalendar()}$('prevDate').onclick=()=>move(-1);$('nextDate').onclick=()=>move(1);
let remain=1500,deadline=null,tickId=null;function showTime(){$('timer').textContent=String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0')}function pause(){if(tickId){clearInterval(tickId);tickId=null;deadline=null}}function tick(){remain=Math.max(0,Math.ceil((deadline-Date.now())/1000));showTime();if(remain===0){pause();$('timerMessage').textContent='25분 완료!'}}$('startTimer').onclick=()=>{if(tickId)return;deadline=Date.now()+remain*1000;tickId=setInterval(tick,250);$('timerMessage').textContent='지금 이 한 가지에만 집중해요.'};$('pauseTimer').onclick=()=>{if(tickId){tick();pause()}};$('resetTimer').onclick=()=>{pause();remain=1500;showTime();$('timerMessage').textContent=''};
let dumpSubs=[],editSubs=[],diaryCursor=new Date(),diaryDate=today();

function subsUI(id,subs,del){const root=$(id);root.replaceChildren();subs.forEach((x,i)=>{const line=document.createElement('div');line.className='entry formrow';const text=document.createElement('span');text.textContent='↳ '+x.title+(x.minutes!=null?' · '+x.minutes+'분':'');line.append(text,makeButton('삭제',()=>del(i)));root.append(line)})}
function addSub(list,prefix,refresh){const title=$(prefix+'Sub').value.trim();if(!title)return;list.push({title,minutes:mins($(prefix+'SubMinutes').value),done:false});$(prefix+'Sub').value='';$(prefix+'SubMinutes').value='';refresh()}
$('dumpSub').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addSub(dumpSubs,'dump',()=>subsUI('dumpSubList',dumpSubs,i=>{dumpSubs.splice(i,1);subsUI('dumpSubList',dumpSubs,j=>{dumpSubs.splice(j,1)})}))}});
$('editSub').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addSub(editSubs,'edit',()=>renderEditSubs())}});
function renderEditSubs(){subsUI('editSubList',editSubs,i=>{editSubs.splice(i,1);renderEditSubs()})}
function dumpFields(){const t=$('dumpType').value;$('dumpQuadrantWrap').hidden=t!=='task';$('dumpDateWrap').hidden=t!=='event';$('dumpTimeWrap').hidden=!['event','habit'].includes(t);$('dumpRepeatWrap').hidden=t!=='habit';$('dumpDayWrap').hidden=t!=='habit';$('dumpTaskDetails').hidden=t!=='task'}
